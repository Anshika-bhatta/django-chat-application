{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Login - Chat App</title>
    <link rel="stylesheet" href="{% static 'chatbot/css/auth.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-header">
            <h1><i class="fas fa-comments"></i> Chat App</h1>
            <p>Connect with friends instantly</p>
        </div>
        
        <div class="auth-body">
            {% if form.errors %}
            <div class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                Please enter a correct username and password.
            </div>
            {% endif %}
            
            <form method="post">
                {% csrf_token %}
                <div class="form-group">
                    <label class="form-label" for="username">
                        <i class="fas fa-user"></i> Username
                    </label>
                    <input type="text" class="form-control" name="username" id="username" placeholder="Enter your username" required>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="password">
                        <i class="fas fa-lock"></i> Password
                    </label>
                    <input type="password" class="form-control" name="password" id="password" placeholder="Enter your password" required>
                </div>
                
                <button type="submit" class="btn-auth">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
        </div>
        
        <div class="auth-footer">
            <p>Don't have an account? <a href="{% url 'register' %}" class="auth-link">Register here</a></p>
        </div>
    </div>
    
    <script src="{% static 'chatbot/js/utils.js' %}"></script>
    <script src="{% static 'chatbot/js/auth.js' %}"></script>
</body>
</html>
